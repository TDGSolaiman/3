<!DOCTYPE html>
<html lang="en">
<head>
  <!--
  Sovexa Labs pause listener
  Paste this <script> into the <head> of EACH of the four apps' index.html,
  BEFORE any other <script>. Then redeploy each app on Vercel.

  It lets the Shopify homepage pause and resume this animation, and tells the
  homepage when a visitor interacts with it. Nothing changes when the app is
  opened on its own (outside the homepage).
-->
<script>
(function () {
  var nativeRaf = window.requestAnimationFrame.bind(window);
  var nativeCancel = window.cancelAnimationFrame.bind(window);
  var paused = false;
  var queued = new Map();
  var nextId = -1;

  // While paused, frame callbacks are held instead of run, so the loop fully stops.
  window.requestAnimationFrame = function (callback) {
    if (!paused) return nativeRaf(callback);
    var id = nextId--;
    queued.set(id, callback);
    return id;
  };
  window.cancelAnimationFrame = function (id) {
    if (queued.has(id)) { queued.delete(id); return; }
    nativeCancel(id);
  };

  function pause() {
    paused = true;
  }

  function play() {
    if (!paused) return;
    paused = false;
    var callbacks = Array.from(queued.values());
    queued.clear();
    // Each app clamps its time step, so the first frame after resuming does not jump.
    callbacks.forEach(function (callback) { nativeRaf(callback); });
  }

  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || data.source !== 'Sovexa Labs-host') return;
    if (data.type === 'pause') pause();
    if (data.type === 'play') play();
  });

  function activate() {
    if (window.parent === window) return;
    window.parent.postMessage({ source: 'Sovexa Labs-embed', type: 'activate' }, '*');
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (type) {
    window.addEventListener(type, activate, { capture: true, passive: true });
  });

  if (window.parent !== window) {
    window.parent.postMessage({ source: 'Sovexa Labs-embed', type: 'ready' }, '*');
  }
})();
</script>

<script>
// ====== INSTELLINGEN (pas gerust aan) ======
const SPLIT_COOLDOWN = 1.0;    // seconden voordat een bal opnieuw kan worden geplet (hoger = trager)
const SWING_SPEED    = 1.15;   // hoe snel de pendel zwaait
const PADDLE_HALF    = 0.19;   // halve breedte van de paddle (als hoek, in radialen)
const PADDLE_TOP     = 0.58;   // waar de brede paddle begint langs de stang (fractie van de pendellengte)
const FLOOR_RADIUS   = 1.5;    // pendellengte = straal van de gebogen vloer (in arena-stralen)
const HUB_RADIUS     = 0.075;  // grootte van het massieve scharnier bovenaan
const BLOCK_TIP      = 0.59;   // hoe ver de zijblokken naar binnen steken (fractie van de pendellengte)
const BLOCK_TOP_Y    = -0.55;  // hoogte waar de zijblokken beginnen (in arena-stralen, negatief = boven het midden)
const CRUSH_DEPTH    = 0.35;   // hoe diep een bal ingedrukt moet worden om geplet te worden (fractie van de balstraal)
const OVERFLOW_ZONE  = 0.62;   // de "bovenzone": alles boven dit punt (0 = midden, 1 = bovenrand) telt voor overflow
const OVERFLOW_FILL  = 0.5;    // hoe vol die bovenzone moet zitten met ballen (0.5 = 50%)
const OVERFLOW_HOLD  = 1.0;    // seconden dat het vol moet blijven voordat de ring explodeert
// ===========================================

const TAU = Math.PI * 2;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let displayDpr = 1, W, H, dpr, R, Ri, cx, cy, S, rb, G, zoneY, zoneArea;
let Q, rho, phiB, Bl, Br, thetaMax, r1, r2, pw, hubR, blocks = [];
const SEG = 72;
let balls, t, state, burstT, pieces;
let crusherTouch = false, theta = 0, thetaDot = 0, crusherParts = [];
let spawnQueue = [], fx = [], sparks = [];
let baseLayer = null, ringLayer = null;
let hueSprites = [], customSprite = null;
let overflowTimer = 0, checkAcc = 0;
let gridHead = new Int32Array(1), gridNext = new Int32Array(1), gridW = 1, gridH = 1;

// ---------- opties (worden door het menu onderaan aangepast) ----------
let colorMode = "original", customColor = "#ff6b9a", customHSL = { h: 340, s: 100, l: 71 }, simSpeed = 1;

function resize() {
  displayDpr = Math.min(window.devicePixelRatio || 1, 2);
  dpr = displayDpr;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);

  R  = Math.min(W * 0.47, H * 0.38);
  Ri = R * 0.945;                // binnenkant van de ring
  cx = W / 2; cy = H * 0.53;
  S  = R / 400;                  // schaalfactor
  rb = Math.max(2.5, R * 0.02);  // radius van een bal
  G  = 650 * S;                  // zwaartekracht

  // pivot van de pendel: bovenaan de ring
  Q   = { x: cx, y: cy - Ri };
  rho = FLOOR_RADIUS * R;        // pendellengte = straal van de gebogen vloer

  // waar de vloerboog de ring raakt (hoek B)
  const yB = (rho * rho - 2 * Ri * Ri) / (2 * Ri);
  const xB = Math.sqrt(Ri * Ri - yB * yB);
  phiB = Math.atan2(xB, yB + Ri);                       // hoek (vanaf recht omlaag) van pivot naar B
  Bl = { x: cx - xB, y: cy + yB };
  Br = { x: cx + xB, y: cy + yB };

  // de pendel zwaait tot de paddle PLAT tegen de onderkant van het zijblok ligt
  thetaMax = phiB - PADDLE_HALF + 0.004;
  r1 = PADDLE_TOP * rho;         // begin van de brede paddle
  r2 = rho - R * 0.006;          // onderkant van de paddle (net boven de vloer)
  pw = R * 0.014;                // halve dikte van de stang
  hubR = R * HUB_RADIUS;

  buildBlocks();

  // bovenzone voor de overflow-controle
  const d = OVERFLOW_ZONE * R;
  zoneY = cy - d;
  zoneArea = Ri * Ri * Math.acos(d / Ri) - d * Math.sqrt(Ri * Ri - d * d);

  hueSprites = []; customSprite = null;
  buildLayers();
  reset();
}

// Tekent alles opnieuw in een andere resolutie (zonder de animatie te herstarten)
function setRenderScale(d) {
  dpr = d;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  hueSprites = []; customSprite = null;
  buildLayers();
}

function reset() {
  balls = [{ x: cx + (Math.random() < 0.5 ? -1 : 1) * R * 0.45, y: cy - R * 0.05, vx: 0, vy: 0, h: 20, rh: Math.random() * 360, cd: 0, pop: 0 }];
  t = 0; state = "play"; burstT = 0; pieces = [];
  spawnQueue = []; fx = []; sparks = [];
  overflowTimer = 0; checkAcc = 0;
}

// ---------- vorm van de arena ----------
function makeNormals(poly) {
  const c0 = { x: 0, y: 0 };
  poly.forEach(p => { c0.x += p.x; c0.y += p.y; });
  c0.x /= poly.length; c0.y /= poly.length;
  return poly.map((a, i) => {
    const b = poly[(i + 1) % poly.length];
    let nx = (b.y - a.y), ny = -(b.x - a.x);
    const l = Math.hypot(nx, ny) || 1;
    nx /= l; ny /= l;
    const mx = (a.x + b.x) / 2 - c0.x, my = (a.y + b.y) / 2 - c0.y;
    if (nx * mx + ny * my < 0) { nx = -nx; ny = -ny; }
    return { x: nx, y: ny };
  });
}

// twee zijblokken: de onderkant ligt op een straal vanaf de pivot (daar komt de paddle plat tegenaan)
function buildBlocks() {
  const sT = BLOCK_TIP * rho;
  const yA = cy + BLOCK_TOP_Y * R;
  const xA = Math.sqrt(Ri * Ri - (yA - cy) * (yA - cy));
  const Tl = { x: Q.x - sT * Math.sin(phiB), y: Q.y + sT * Math.cos(phiB) };   // tip
  const Al = { x: cx - xA, y: yA };                                             // bovenhoek op de ring
  const aB = Math.atan2(Bl.y - cy, Bl.x - cx);
  let aA = Math.atan2(Al.y - cy, Al.x - cx);
  if (aA < aB) aA += TAU;
  const left = [Al, Tl, Bl];
  for (let k = 1; k <= 6; k++) {                    // boog langs de ring
    const a = aB + ((aA - aB) * k) / 7;
    left.push({ x: cx + Ri * Math.cos(a), y: cy + Ri * Math.sin(a) });
  }
  const right = left.map(p => ({ x: 2 * cx - p.x, y: p.y }));
  blocks = [left, right].map(poly => ({ poly, n: makeNormals(poly) }));
}

// ---------- botsingen met convexe vormen ----------
function polyContact(b, poly, nrm) {
  const n = poly.length;
  let best = Infinity, bqx = 0, bqy = 0, inside = true, maxSd = -Infinity, maxI = 0;
  for (let i = 0; i < n; i++) {
    const a = poly[i], c = poly[(i + 1) % n];
    const ex = c.x - a.x, ey = c.y - a.y;
    let tt = ((b.x - a.x) * ex + (b.y - a.y) * ey) / (ex * ex + ey * ey);
    tt = Math.max(0, Math.min(1, tt));
    const qx = a.x + ex * tt, qy = a.y + ey * tt;
    const d2 = (b.x - qx) ** 2 + (b.y - qy) ** 2;
    const sd = (b.x - a.x) * nrm[i].x + (b.y - a.y) * nrm[i].y;
    if (sd > 0) inside = false;
    if (sd > maxSd) { maxSd = sd; maxI = i; }
    if (d2 < best) { best = d2; bqx = qx; bqy = qy; }
  }
  let nx, ny, pen;
  if (inside) {
    nx = nrm[maxI].x; ny = nrm[maxI].y; pen = -maxSd + rb;
    bqx = b.x - nx * maxSd; bqy = b.y - ny * maxSd;
  } else {
    const d = Math.sqrt(best);
    if (d >= rb) return null;
    if (d < 1e-6) { nx = nrm[maxI].x; ny = nrm[maxI].y; }
    else { nx = (b.x - bqx) / d; ny = (b.y - bqy) / d; }
    pen = rb - d;
  }
  return { nx, ny, pen, qx: bqx, qy: bqy };
}

// ---------- de pendel (stang + paddle) ----------
function updateCrusher() {
  theta    = thetaMax * Math.sin(SWING_SPEED * t);
  thetaDot = thetaMax * SWING_SPEED * Math.cos(SWING_SPEED * t);
  const sn = Math.sin(theta), cs = Math.cos(theta);
  const w2 = (u, v) => ({ x: Q.x + u * cs + v * sn, y: Q.y - u * sn + v * cs });  // pendel-coordinaten -> wereld
  const sa = Math.sin(PADDLE_HALF), ca = Math.cos(PADDLE_HALF);

  const vTop = r1 * ca + pw;
  const pole = [w2(-pw, 0), w2(pw, 0), w2(pw, vTop), w2(-pw, vTop)];

  const paddle = [w2(-r1 * sa, r1 * ca), w2(r1 * sa, r1 * ca)];
  const K = 10;
  for (let k = 0; k <= K; k++) {
    const a = PADDLE_HALF - (2 * PADDLE_HALF * k) / K;
    paddle.push(w2(r2 * Math.sin(a), r2 * Math.cos(a)));
  }
  crusherParts = [
    { poly: pole,   n: makeNormals(pole),   paddle: false },
    { poly: paddle, n: makeNormals(paddle), paddle: true }
  ];
}

function collideCrusher(b) {
  // snelle controle in het assenstelsel van de pendel
  const dx = b.x - Q.x, dy = b.y - Q.y;
  const sn = Math.sin(theta), cs = Math.cos(theta);
  const u = dx * cs - dy * sn, v = dx * sn + dy * cs;
  const ca = Math.cos(PADDLE_HALF);
  const nearPole = Math.abs(u) < pw + rb * 2 && v < r1 * ca + rb * 2;
  const nearPaddle = v > r1 * ca - rb * 2 && v < r2 + rb * 2 && Math.abs(u) < v * Math.tan(PADDLE_HALF) + rb * 2.5;
  if (!nearPole && !nearPaddle) return;

  for (const part of crusherParts) {
    if (part.paddle ? !nearPaddle : !nearPole) continue;
    const c = polyContact(b, part.poly, part.n);
    if (!c) continue;
    b.x += c.nx * c.pen; b.y += c.ny * c.pen;
    const ox = c.qx - Q.x, oy = c.qy - Q.y;
    const vwx = thetaDot * oy, vwy = -thetaDot * ox;       // snelheid van het contactpunt
    if (part.paddle) crusherTouch = true;
    bounce(b, c.nx, c.ny, vwx, vwy, 0.98);
  }
}

// Zijblok: alleen de twee zichtbare randen (boven en onder) duwen een bal weg, altijd de arena in
function blockContact(b, blk) {
  const A = blk.poly[0], T = blk.poly[1], B = blk.poly[2];
  const n0 = blk.n[0], n1 = blk.n[1];
  const sd0 = (b.x - A.x) * n0.x + (b.y - A.y) * n0.y;
  const sd1 = (b.x - T.x) * n1.x + (b.y - T.y) * n1.y;
  if (sd0 <= 0 && sd1 <= 0) {                        // bal zit in het blok: kortste weg naar buiten
    const f = sd0 > sd1 ? n0 : n1, sd = Math.max(sd0, sd1);
    return { nx: f.x, ny: f.y, pen: -sd + rb };
  }
  let best = Infinity, bqx = 0, bqy = 0;
  for (const [p, q] of [[A, T], [T, B]]) {
    const ex = q.x - p.x, ey = q.y - p.y;
    let tt = ((b.x - p.x) * ex + (b.y - p.y) * ey) / (ex * ex + ey * ey);
    tt = Math.max(0, Math.min(1, tt));
    const qx = p.x + ex * tt, qy = p.y + ey * tt;
    const d2 = (b.x - qx) ** 2 + (b.y - qy) ** 2;
    if (d2 < best) { best = d2; bqx = qx; bqy = qy; }
  }
  const d = Math.sqrt(best);
  if (d >= rb || d < 1e-6) return null;
  return { nx: (b.x - bqx) / d, ny: (b.y - bqy) / d, pen: rb - d };
}

// ---------- vaste delen: ring, gebogen vloer, zijblokken, scharnier ----------
function collideRing(b) {
  const dx = b.x - cx, dy = b.y - cy;
  const dist = Math.hypot(dx, dy);
  if (dist > Ri - rb) {
    const nx = dx / dist, ny = dy / dist;
    b.x = cx + nx * (Ri - rb); b.y = cy + ny * (Ri - rb);
    bounce(b, -nx, -ny, 0, 0, 0.95);
  }
}

function collideFloor(b) {
  const dx = b.x - Q.x, dy = b.y - Q.y, d = Math.hypot(dx, dy), lim = rho - rb;
  if (d > lim) {
    b.x = Q.x + (dx / d) * lim; b.y = Q.y + (dy / d) * lim;
    bounce(b, -dx / d, -dy / d, 0, 0, 0.55);
  }
}

function collideHub(b) {
  const dx = b.x - Q.x, dy = b.y - Q.y, minD = hubR + rb;
  const d2 = dx * dx + dy * dy;
  if (d2 >= minD * minD) return;
  let d = Math.sqrt(d2), nx, ny;
  if (d < 1e-6) { nx = 0; ny = 1; d = 0; } else { nx = dx / d; ny = dy / d; }
  b.x = Q.x + nx * minD; b.y = Q.y + ny * minD;
  bounce(b, nx, ny, 0, 0, 0.5);
}

function collideStatic(b) {
  if (state === "play") collideRing(b);
  collideFloor(b);
  if (Math.abs(b.x - cx) > R * 0.4) {
    for (const blk of blocks) {
      const c = blockContact(b, blk);
      if (c) { b.x += c.nx * c.pen; b.y += c.ny * c.pen; bounce(b, c.nx, c.ny, 0, 0, 0.6); }
    }
  }
  collideHub(b);
}

// Hoe diep zit de bal in een vast deel gedrukt? (door de paddle erin geduwd)
function staticPen(b) {
  let m = 0;
  if (state === "play") m = Math.max(m, Math.hypot(b.x - cx, b.y - cy) - (Ri - rb));
  const dq = Math.hypot(b.x - Q.x, b.y - Q.y);
  m = Math.max(m, dq - (rho - rb));
  m = Math.max(m, hubR + rb - dq);
  if (Math.abs(b.x - cx) > R * 0.4) {
    for (const blk of blocks) {
      const c = blockContact(b, blk);
      if (c) m = Math.max(m, c.pen);
    }
  }
  return m;
}

// Is de paddle al in de richting van deze bal gekomen? (pas dan kan hij geplet worden)
function crusherReached(b) {
  const dx = b.x - Q.x, dy = b.y - Q.y;
  const r = Math.hypot(dx, dy) || 1;
  const aBall = Math.atan2(dx, dy);          // hoek vanaf recht omlaag
  const tol = (rb * 1.2) / r;
  return b.x < cx ? (theta - PADDLE_HALF) <= aBall + tol
                   : (theta + PADDLE_HALF) >= aBall - tol;
}

// Bal wordt platgedrukt: hij verdwijnt en er verschijnen 2 ballen aan de andere kant
function crush(b) {
  b.dead = true;
  playCrusherSound();
  const mx = 2 * cx - b.x;                  // spiegel aan de andere kant van de arena
  const my = b.y;
  if (fx.length < 300) {
    fx.push({ x: b.x, y: b.y, age: 0 });
    fx.push({ x: mx, y: my, age: 0 });
  }
  if (sparks.length < 1500) {
    const hue = colorMode === "rainbow" ? b.rh : b.h;
    for (let k = 0; k < 8; k++) {
      const a = Math.random() * TAU, sp = (120 + Math.random() * 260) * S;
      sparks.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80 * S, life: 0.45, h: hue });
    }
  }
  // nieuwe ballen verschijnen iets richting het midden van de arena
  let dxs = cx - mx, dys = cy - my;
  const dl = Math.hypot(dxs, dys) || 1; dxs /= dl; dys /= dl;
  for (let k = 0; k < 2; k++) {
    const off = rb * (1.5 + Math.random() * 2);
    spawnQueue.push({
      x: mx + dxs * off + (Math.random() - 0.5) * rb * 2,
      y: my + dys * off + (Math.random() - 0.5) * rb * 2,
      vx: (Math.random() - 0.5) * 300 * S,
      vy: -(100 + Math.random() * 250) * S,
      h: (20 + ((b.h > 180 ? b.h - 360 : b.h) - 20) * 0.7 + Math.random() * 24 - 12 + 360) % 360,
      rh: Math.random() * 360,
      cd: SPLIT_COOLDOWN,
      pop: 0.25
    });
  }
}

// ---------- OVERFLOW: de ring explodeert pas als de arena echt vol zit ----------
function checkOverflow(dt) {
  checkAcc += dt;
  if (checkAcc < 0.1) return;
  const span = checkAcc; checkAcc = 0;
  let cnt = 0;
  for (let i = 0; i < balls.length; i++) if (balls[i].y < zoneY) cnt++;
  const filled = (cnt * Math.PI * rb * rb) / zoneArea;
  if (filled >= OVERFLOW_FILL) overflowTimer += span;
  else overflowTimer = Math.max(0, overflowTimer - span);
  // noodrem (alleen om te voorkomen dat een traag apparaat vastloopt)
  if (overflowTimer >= OVERFLOW_HOLD || balls.length > 5000) startBurst();
}

function startBurst() {
  state = "burst"; burstT = 0;
  const Rmid = (Ri + R) / 2;
  pieces = [];
  for (let i = 0; i < SEG; i++) {
    const a = ((i + 0.5) / SEG) * TAU;
    const sp = (150 + Math.random() * 350) * S;
    pieces.push({
      a, x: cx + Math.cos(a) * Rmid, y: cy + Math.sin(a) * Rmid,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200 * S,
      rot: a, vr: (Math.random() - 0.5) * 8
    });
  }
  for (const b of balls) {
    b.vx += ((b.x - cx) / R) * 350 * S + (Math.random() - 0.5) * 100 * S;
    b.vy += ((b.y - cy) / R) * 350 * S - Math.random() * 250 * S;
  }
}

function step(dt) {
  t += dt;
  updateCrusher();
  const n = balls.length;

  for (let i = 0; i < n; i++) {
    const b = balls[i];
    b.cd -= dt;
    if (b.pop > 0) b.pop -= dt;
    b.vy += G * dt;
    b.x += b.vx * dt; b.y += b.vy * dt;

    // 1. vaste delen (ring, vloer, zijblokken, scharnier)
    collideStatic(b);

    // 2. de paddle duwt de bal weg
    crusherTouch = false;
    collideCrusher(b);

    // 3. GEPLET? Alleen als de paddle de bal in een vast deel INDRUKT
    const closing = b.x < cx ? thetaDot < -0.05 : thetaDot > 0.05;
    if (state === "play" && !b.dead && crusherTouch && closing && b.cd <= 0 &&
        crusherReached(b) && staticPen(b) > CRUSH_DEPTH * rb) crush(b);

    // 4. vaste delen nogmaals oplossen
    collideStatic(b);
  }

  if (spawnQueue.length || fx.length || sparks.length) {
    if (spawnQueue.length) {
      balls = balls.filter(b => !b.dead);
      for (const nb of spawnQueue) balls.push(nb);
      spawnQueue = [];
    }
    for (const f of fx) f.age += dt;
    fx = fx.filter(f => f.age < 0.35);
    for (const sp of sparks) {
      sp.life -= dt; sp.vy += G * 0.6 * dt;
      sp.x += sp.vx * dt; sp.y += sp.vy * dt;
    }
    sparks = sparks.filter(sp => sp.life > 0);
  }

  if (state === "play") {
    collideBalls();
    checkOverflow(dt);
  }

  if (state === "burst") {
    burstT += dt;
    for (const p of pieces) {
      p.vy += 800 * S * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
    balls = balls.filter(b => b.y < H + 100 && b.x > -100 && b.x < W + 100);
    if (burstT > 4) { finishRun(); reset(); }
  }
}

// ---------- GELUID + AUDIO VOOR OPNAME ----------
let audioCtx = null, soundMaster = null, audioRecordDestination = null;

function initAudio() {
  if (!audioCtx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return false;
    audioCtx = new AudioCtx();
    soundMaster = audioCtx.createGain();
    soundMaster.gain.value = 0.35;
    audioRecordDestination = audioCtx.createMediaStreamDestination();
    soundMaster.connect(audioCtx.destination);
    soundMaster.connect(audioRecordDestination);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return true;
}

let soundEnabled = false;

async function enableSound() {
  if (!initAudio()) {
    alert("Your browser does not support Web Audio.");
    return;
  }
  try { await audioCtx.resume(); } catch (err) {}
  soundEnabled = audioCtx.state === "running";
  $("soundBtn").classList.toggle("on", soundEnabled);
  $("soundBtn").textContent = soundEnabled ? "🔊 Sound on" : "🔇 Enable sound";
  if (soundEnabled) $("soundStartOverlay").style.display = "none";
}

let lastBallSound = 0, lastCrusherSound = 0;
let ballHitVolume = 0.5;

// Dezelfde zachtere geluiden als in de eerdere SatisfyLab-simulaties.
function playBallHit(impact = 1) {
  if (!soundEnabled || !audioCtx || !soundMaster || audioCtx.state !== "running") return;
  const nowMs = performance.now();
  if (nowMs - lastBallSound < 45) return;
  lastBallSound = nowMs;

  const strength = Math.max(0.15, Math.min(1, impact));
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(500 + strength * 450, now);
  osc.frequency.exponentialRampToValueAtTime(180, now + 0.045);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(0.12 * strength * ballHitVolume, now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
  osc.connect(gain); gain.connect(soundMaster);
  osc.start(now); osc.stop(now + 0.065);
}

function playCrusherSound() {
  if (!soundEnabled || !audioCtx || !soundMaster || audioCtx.state !== "running") return;
  const nowMs = performance.now();
  if (nowMs - lastCrusherSound < 100) return;
  lastCrusherSound = nowMs;

  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const og = audioCtx.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(105, now);
  osc.frequency.exponentialRampToValueAtTime(38, now + 0.22);
  og.gain.setValueAtTime(0.0001, now);
  og.gain.linearRampToValueAtTime(0.35, now + 0.008);
  og.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
  osc.connect(og); og.connect(soundMaster);
  osc.start(now); osc.stop(now + 0.29);

  const length = Math.floor(audioCtx.sampleRate * 0.16);
  const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / length);
  const noise = audioCtx.createBufferSource();
  const filter = audioCtx.createBiquadFilter();
  const ng = audioCtx.createGain();
  noise.buffer = buffer;
  filter.type = "lowpass"; filter.frequency.value = 1800;
  ng.gain.setValueAtTime(0.0001, now);
  ng.gain.linearRampToValueAtTime(0.22, now + 0.004);
  ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
  noise.connect(filter); filter.connect(ng); ng.connect(soundMaster);
  noise.start(now); noise.stop(now + 0.17);
}
// ------------------------------------------------

function bounce(b, nx, ny, vwx, vwy, e) {
  const rx = b.vx - vwx, ry = b.vy - vwy;
  const vn = rx * nx + ry * ny;
  if (vn < 0) {
    const impact = -vn;
    const j = -(1 + e) * vn;
    b.vx += nx * j; b.vy += ny * j;
    // Zacht tikgeluid bij botsingen tegen ring, vloer, zijblokken en crusher.
    if (impact > 28) playBallHit(Math.min(1, impact / 220));
    return impact;
  }
  return 0;
}

function collideBalls() {
  const n = balls.length, cell = rb * 2;
  const md = rb * 2, md2 = md * md;
  // Meer oplossingsrondes houden de ballen uit elkaar wanneer de arena vol raakt.
  const passes = n > 300 ? 5 : 3;

  for (let pass = 0; pass < passes; pass++) {
    // Het raster opnieuw opbouwen nadat ballen in de vorige ronde zijn verplaatst.
    gridW = Math.ceil(W / cell) + 3;
    gridH = Math.ceil(H / cell) + 3;
    if (gridHead.length < gridW * gridH) gridHead = new Int32Array(gridW * gridH);
    gridHead.fill(-1, 0, gridW * gridH);
    if (gridNext.length < n) gridNext = new Int32Array(n + 500);

    for (let i = 0; i < n; i++) {
      const b = balls[i];
      const gx = Math.max(0, Math.min(gridW - 1, Math.floor(b.x / cell) + 1));
      const gy = Math.max(0, Math.min(gridH - 1, Math.floor(b.y / cell) + 1));
      const idx = gy * gridW + gx;
      gridNext[i] = gridHead[idx];
      gridHead[idx] = i;
      b.gx = gx; b.gy = gy;
    }

    for (let i = 0; i < n; i++) {
      const a = balls[i];
      for (let oy = -1; oy <= 1; oy++) {
        const gy = a.gy + oy;
        if (gy < 0 || gy >= gridH) continue;
        for (let ox = -1; ox <= 1; ox++) {
          const gx = a.gx + ox;
          if (gx < 0 || gx >= gridW) continue;
          for (let j = gridHead[gy * gridW + gx]; j !== -1; j = gridNext[j]) {
            if (j <= i) continue;
            const b = balls[j];
            const dx = b.x - a.x, dy = b.y - a.y;
            const d2 = dx * dx + dy * dy;
            if (d2 >= md2) continue;

            let d = Math.sqrt(d2), nx, ny;
            if (d < 1e-6) {
              const ang = Math.random() * TAU;
              nx = Math.cos(ang); ny = Math.sin(ang); d = 0;
            } else {
              nx = dx / d; ny = dy / d;
            }

            const overlap = md - d;
            const correction = overlap * 0.72;
            a.x -= nx * correction * 0.5;
            a.y -= ny * correction * 0.5;
            b.x += nx * correction * 0.5;
            b.y += ny * correction * 0.5;

            const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
            if (vn < -0.5) {
              if (pass === 0) playBallHit(Math.min(1, Math.abs(vn) / 220));
              const jj = -(1.9) * vn * 0.5;
              a.vx -= nx * jj; a.vy -= ny * jj;
              b.vx += nx * jj; b.vy += ny * jj;
            }
          }
        }
      }
    }
  }
}

function hexToHsl(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  let h = 0, s = 0; const l = (mx + mn) / 2, d = mx - mn;
  if (d) {
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return { h, s: s * 100, l: l * 100 };
}

function makeBallSprite(h, s, l) {
  const r = rb * dpr, pad = 2, SZ = Math.ceil(2 * r) + pad * 2;
  const c = document.createElement("canvas");
  c.width = SZ; c.height = SZ;
  const g = c.getContext("2d");
  const cc = SZ / 2;

  // bol met licht van linksboven
  const gr = g.createRadialGradient(cc - r * 0.35, cc - r * 0.4, r * 0.08, cc, cc, r);
  gr.addColorStop(0,    `hsl(${h},${s * 0.6}%,${Math.min(92, l + 30)}%)`);
  gr.addColorStop(0.35, `hsl(${h},${s}%,${l}%)`);
  gr.addColorStop(0.85, `hsl(${h},${s}%,${Math.max(12, l - 24)}%)`);
  gr.addColorStop(1,    `hsl(${h},${s}%,${Math.max(8, l - 36)}%)`);
  g.fillStyle = gr;
  g.beginPath(); g.arc(cc, cc, r, 0, TAU); g.fill();

  // weerkaatst licht rechtsonder
  g.save();
  g.beginPath(); g.arc(cc, cc, r, 0, TAU); g.clip();
  const g2 = g.createRadialGradient(cc + r * 0.3, cc + r * 0.6, 0, cc + r * 0.3, cc + r * 0.6, r * 0.7);
  g2.addColorStop(0, "rgba(255,255,255,0.22)"); g2.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = g2; g.fillRect(0, 0, SZ, SZ);
  g.restore();

  // glanzende highlight
  const g3 = g.createRadialGradient(cc - r * 0.4, cc - r * 0.45, 0, cc - r * 0.4, cc - r * 0.45, r * 0.38);
  g3.addColorStop(0, "rgba(255,255,255,0.95)"); g3.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = g3;
  g.beginPath(); g.arc(cc - r * 0.4, cc - r * 0.45, r * 0.38, 0, TAU); g.fill();

  return { c, size: SZ / dpr };
}

function drawBalls() {
  for (let i = 0; i < balls.length; i++) {
    const b = balls[i];
    let sp;
    if (colorMode === "custom") {
      sp = customSprite || (customSprite = makeBallSprite(customHSL.h, customHSL.s, Math.max(35, Math.min(70, customHSL.l))));
    } else {
      const hi = Math.round((colorMode === "rainbow" ? b.rh : b.h) / 4) % 90;
      sp = hueSprites[hi] || (hueSprites[hi] = makeBallSprite(hi * 4, 75, 60));
    }
    let size = sp.size;
    if (b.pop > 0) size *= 1 - Math.pow(b.pop / 0.25, 2) * 0.7;   // "plop"-effect bij het verschijnen
    ctx.drawImage(sp.c, b.x - size / 2, b.y - size / 2, size, size);
  }
}

function drawPiece(g, x, y, rot) {
  const thick = R * 0.055, len = ((TAU * ((Ri + R) / 2)) / SEG) * 0.92;
  g.save();
  g.translate(x, y);
  g.rotate(rot);
  const gr = g.createLinearGradient(-thick / 2, 0, thick / 2, 0);
  gr.addColorStop(0, "#6a6a94"); gr.addColorStop(0.5, "#4a4a70"); gr.addColorStop(1, "#2f2f4a");
  g.fillStyle = gr;
  g.fillRect(-thick / 2, -len / 2, thick, len);
  g.fillStyle = "rgba(255,255,255,0.16)";                      // lichte binnenrand
  g.fillRect(-thick / 2, -len / 2, thick * 0.14, len);
  g.fillStyle = "rgba(0,0,0,0.3)";                             // donkere buitenrand
  g.fillRect(thick / 2 - thick * 0.1, -len / 2, thick * 0.1, len);
  g.fillStyle = "#1f1f33";                                     // bout
  g.beginPath(); g.arc(0, 0, thick * 0.14, 0, TAU); g.fill();
  g.fillStyle = "rgba(255,255,255,0.35)";
  g.beginPath(); g.arc(-thick * 0.04, -thick * 0.04, thick * 0.05, 0, TAU); g.fill();
  g.restore();
}

function makeLayer() {
  const c = document.createElement("canvas");
  c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { c, g };
}

function bolt(g, x, y, r) {
  g.fillStyle = "#2c2c48";
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  g.fillStyle = "rgba(255,255,255,0.4)";
  g.beginPath(); g.arc(x - r * 0.3, y - r * 0.3, r * 0.4, 0, TAU); g.fill();
}


// ---------- vaste lagen (1x getekend, daarna alleen gekopieerd) ----------
function buildLayers() {
  const base = makeLayer(), ring = makeLayer();
  const g = base.g;

  g.fillStyle = "#0b0b14"; g.fillRect(0, 0, W, H);

  // titel
  g.textAlign = "center";
  g.fillStyle = "#fff";
  g.font = `bold ${R * 0.1}px "Arial Narrow", Arial, sans-serif`;
  g.fillText("Will It Overflow?", cx, cy - R - R * 0.17);
  g.fillStyle = "#8a8aa8";
  g.font = `${R * 0.045}px Arial, sans-serif`;
  g.fillText("every hit splits a ball", cx, cy - R - R * 0.09);

  // arena-achtergrond met diepte
  const bg = g.createRadialGradient(cx, cy - R * 0.25, R * 0.1, cx, cy, Ri);
  bg.addColorStop(0, "#17172e"); bg.addColorStop(1, "#090913");
  g.fillStyle = bg;
  g.beginPath(); g.arc(cx, cy, Ri, 0, TAU); g.fill();
  g.strokeStyle = "rgba(130,130,200,0.07)"; g.lineWidth = 1;
  for (const f of [0.33, 0.66]) { g.beginPath(); g.arc(cx, cy, Ri * f, 0, TAU); g.stroke(); }
  const sh = g.createRadialGradient(cx, cy, Ri * 0.82, cx, cy, Ri);
  sh.addColorStop(0, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(0,0,0,0.55)");
  g.fillStyle = sh;
  g.beginPath(); g.arc(cx, cy, Ri, 0, TAU); g.fill();

  // ----- gebogen vloer (boog rond de pivot) -----
  const aBLq = Math.atan2(Bl.y - Q.y, Bl.x - Q.x), aBRq = Math.atan2(Br.y - Q.y, Br.x - Q.x);
  const aBLc = Math.atan2(Bl.y - cy, Bl.x - cx),   aBRc = Math.atan2(Br.y - cy, Br.x - cx);
  g.save();
  g.beginPath();
  g.moveTo(Bl.x, Bl.y);
  g.arc(Q.x, Q.y, rho, aBLq, aBRq, true);
  g.arc(cx, cy, Ri, aBRc, aBLc, false);
  g.closePath();
  const fg = g.createLinearGradient(0, Q.y + rho, 0, cy + Ri);
  fg.addColorStop(0, "#a2a2c6"); fg.addColorStop(0.5, "#76769c"); fg.addColorStop(1, "#4c4c70");
  g.fillStyle = fg; g.fill();
  g.clip();

  // gebogen groeven (parallel aan de vloerboog)
  for (let k = 1; k <= 4; k++) {
    const rr = rho + k * R * 0.045;
    g.beginPath(); g.arc(Q.x, Q.y, rr, aBLq + 0.3, aBRq - 0.3, true);
    g.strokeStyle = "rgba(15,15,35,0.4)"; g.lineWidth = 2; g.stroke();
    g.beginPath(); g.arc(Q.x, Q.y, rr - 2, aBLq + 0.3, aBRq - 0.3, true);
    g.strokeStyle = "rgba(255,255,255,0.14)"; g.lineWidth = 1; g.stroke();
  }
  // naden die vanaf de pivot naar beneden waaieren
  for (let i = -5; i <= 5; i++) {
    const a = (i * phiB) / 5;
    g.beginPath();
    g.moveTo(Q.x + rho * Math.sin(a), Q.y + rho * Math.cos(a));
    g.lineTo(Q.x + (rho + R * 0.8) * Math.sin(a), Q.y + (rho + R * 0.8) * Math.cos(a));
    g.strokeStyle = "rgba(15,15,35,0.35)"; g.lineWidth = 2; g.stroke();
  }
  // bouten langs de boog
  for (let a = -phiB + 0.05; a < phiB - 0.04; a += (R * 0.1) / rho) {
    const rr = rho + R * 0.025;
    const bx = Q.x + rr * Math.sin(a), by = Q.y + rr * Math.cos(a);
    if (Math.hypot(bx - cx, by - cy) < Ri - R * 0.03) bolt(g, bx, by, R * 0.009);
  }
  g.restore();

  // opstaande lip langs de vloer
  g.beginPath(); g.arc(Q.x, Q.y, rho, aBLq, aBRq, true);
  g.strokeStyle = "rgba(10,10,30,0.55)"; g.lineWidth = R * 0.014; g.stroke();
  g.beginPath(); g.arc(Q.x, Q.y, rho, aBLq, aBRq, true);
  g.strokeStyle = "#d6d6f2"; g.lineWidth = R * 0.006; g.stroke();

  // ----- zijblokken -----
  blocks.forEach((blk, idx) => {
    const poly = blk.poly, A = poly[0], T = poly[1], B = poly[2];
    const sgn = idx === 0 ? -1 : 1;
    g.save();
    g.beginPath(); g.moveTo(poly[0].x, poly[0].y);
    for (let i = 1; i < poly.length; i++) g.lineTo(poly[i].x, poly[i].y);
    g.closePath();
    const bgd = g.createLinearGradient(T.x, T.y, cx + sgn * Ri, T.y);
    bgd.addColorStop(0, "#b9bbdd"); bgd.addColorStop(0.45, "#8486ab"); bgd.addColorStop(1, "#56587e");
    g.fillStyle = bgd; g.fill();
    g.clip();

    // naden: stralen vanaf de pivot
    for (const f of [0.35, 0.7]) {
      const a = phiB * (1 + f * 0.9);
      const sx = Math.sin(a) * sgn, sy = Math.cos(a);
      g.beginPath();
      g.moveTo(Q.x + sx * rho * 0.5, Q.y + sy * rho * 0.5);
      g.lineTo(Q.x + sx * rho * 1.2, Q.y + sy * rho * 1.2);
      g.strokeStyle = "rgba(15,15,35,0.3)"; g.lineWidth = 2; g.stroke();
    }
    // paneellijn evenwijdig aan de onderkant
    const nLow = blk.n[1];
    for (const off of [R * 0.12, R * 0.24]) {
      g.beginPath();
      g.moveTo(T.x - nLow.x * off, T.y - nLow.y * off);
      g.lineTo(B.x - nLow.x * off, B.y - nLow.y * off);
      g.strokeStyle = "rgba(15,15,35,0.28)"; g.lineWidth = 2; g.stroke();
      g.strokeStyle = "rgba(255,255,255,0.12)"; g.lineWidth = 1;
      g.beginPath();
      g.moveTo(T.x - nLow.x * off + 2, T.y - nLow.y * off + 2);
      g.lineTo(B.x - nLow.x * off + 2, B.y - nLow.y * off + 2);
      g.stroke();
    }
    // waarschuwingsband langs de onderkant (daar wordt geplet)
    const w = R * 0.034, ex = B.x - T.x, ey = B.y - T.y, el = Math.hypot(ex, ey);
    const ux = ex / el, uy = ey / el;
    g.fillStyle = "#1b1b2d";
    g.beginPath();
    g.moveTo(T.x, T.y); g.lineTo(B.x, B.y);
    g.lineTo(B.x - nLow.x * w, B.y - nLow.y * w); g.lineTo(T.x - nLow.x * w, T.y - nLow.y * w);
    g.closePath(); g.fill();
    const NS = 14;
    g.fillStyle = "#f0c43c";
    for (let k = 0; k < NS; k += 2) {
      const s0 = k / NS, s1 = (k + 1) / NS, sl = w * 0.8;
      const p0 = { x: T.x + ex * s0, y: T.y + ey * s0 }, p1 = { x: T.x + ex * s1, y: T.y + ey * s1 };
      g.beginPath();
      g.moveTo(p0.x, p0.y); g.lineTo(p1.x, p1.y);
      g.lineTo(p1.x - nLow.x * w + ux * sl, p1.y - nLow.y * w + uy * sl);
      g.lineTo(p0.x - nLow.x * w + ux * sl, p0.y - nLow.y * w + uy * sl);
      g.closePath(); g.fill();
    }
    g.restore();

    // randen (lichte rand + schaduw)
    g.lineJoin = "round";
    g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(T.x, T.y); g.lineTo(B.x, B.y);
    g.strokeStyle = "rgba(10,10,30,0.55)"; g.lineWidth = R * 0.012; g.stroke();
    g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(T.x, T.y); g.lineTo(B.x, B.y);
    g.strokeStyle = "#e2e3f6"; g.lineWidth = R * 0.005; g.stroke();

    // bouten langs de bovenrand en in de blokken
    const ax = T.x - A.x, ay = T.y - A.y, al = Math.hypot(ax, ay);
    const nTop = blk.n[0];
    for (let tt = R * 0.07; tt < al - R * 0.04; tt += R * 0.09) {
      bolt(g, A.x + (ax / al) * tt - nTop.x * R * 0.035, A.y + (ay / al) * tt - nTop.y * R * 0.035, R * 0.008);
    }
    for (const [fx2, fy2] of [[0.62, 0.55], [0.62, 0.8]]) {
      bolt(g, T.x + (B.x - T.x) * fy2 * 0.5 + sgn * R * (0.12 + fx2 * 0.1), T.y + (B.y - T.y) * fy2 * 0.5 - R * 0.02, R * 0.009);
    }
  });

  // ----- ring (aparte laag zodat hij kan exploderen) -----
  const rg = ring.g, Rmid = (Ri + R) / 2;
  for (let i = 0; i < SEG; i++) {
    const a = ((i + 0.5) / SEG) * TAU;
    drawPiece(rg, cx + Math.cos(a) * Rmid, cy + Math.sin(a) * Rmid, a);
  }
  rg.strokeStyle = "rgba(150,150,230,0.22)"; rg.lineWidth = 1.5;
  rg.beginPath(); rg.arc(cx, cy, Ri, 0, TAU); rg.stroke();
  rg.strokeStyle = "rgba(0,0,0,0.5)";
  rg.beginPath(); rg.arc(cx, cy, R + 0.5, 0, TAU); rg.stroke();

  baseLayer = base; ringLayer = ring;
}

// ---------- de pendel: stang + paddle ----------
function drawCrusher() {
  const al = PADDLE_HALF, sa = Math.sin(al), ca = Math.cos(al);
  const hw2 = r2 * sa;
  const pt = (r, a) => [r * Math.sin(a), r * Math.cos(a)];
  const paddlePath = () => {
    ctx.beginPath();
    ctx.moveTo(-r1 * sa, r1 * ca);
    ctx.lineTo(r1 * sa, r1 * ca);
    ctx.lineTo(r2 * sa, r2 * ca);
    ctx.arc(0, 0, r2, Math.PI / 2 - al, Math.PI / 2 + al, false);
    ctx.closePath();
  };

  ctx.save();
  ctx.translate(Q.x, Q.y);
  ctx.rotate(-theta);

  // --- stang ---
  const vTop = r1 * ca + pw;
  const pg = ctx.createLinearGradient(-pw, 0, pw, 0);
  pg.addColorStop(0, "#8c8fb8"); pg.addColorStop(0.5, "#dcdef4"); pg.addColorStop(1, "#8c8fb8");
  ctx.fillStyle = pg;
  ctx.fillRect(-pw, 0, pw * 2, vTop);
  ctx.fillStyle = "rgba(20,20,60,0.35)";
  ctx.fillRect(pw * 0.55, 0, pw * 0.45, vTop);
  for (const f of [0.22, 0.45, 0.68]) bolt(ctx, 0, vTop * f, pw * 0.5);
  // koppelstuk onderaan de stang
  const cw = R * 0.05, ch = R * 0.026, cy0 = r1 * ca - R * 0.045;
  const cg = ctx.createLinearGradient(-cw, 0, cw, 0);
  cg.addColorStop(0, "#777aa6"); cg.addColorStop(0.5, "#c9cbe9"); cg.addColorStop(1, "#777aa6");
  ctx.fillStyle = cg; ctx.fillRect(-cw, cy0, cw * 2, ch);
  ctx.strokeStyle = "rgba(25,25,60,0.6)"; ctx.lineWidth = 1; ctx.strokeRect(-cw, cy0, cw * 2, ch);
  bolt(ctx, -cw * 0.72, cy0 + ch / 2, R * 0.006); bolt(ctx, cw * 0.72, cy0 + ch / 2, R * 0.006);

  // --- paddle: lichaam met schaduw en metaalglans ---
  ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowBlur = R * 0.03; ctx.shadowOffsetY = R * 0.012;
  const body = ctx.createLinearGradient(-hw2, 0, hw2, 0);
  body.addColorStop(0, "#8c8fb8"); body.addColorStop(0.5, "#c9cbe9"); body.addColorStop(1, "#8c8fb8");
  ctx.fillStyle = body; paddlePath(); ctx.fill();
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  const tg = ctx.createLinearGradient(0, r1 * ca, 0, r2);
  tg.addColorStop(0, "rgba(10,10,40,0.38)"); tg.addColorStop(0.5, "rgba(10,10,40,0)");
  ctx.fillStyle = tg; paddlePath(); ctx.fill();

  ctx.save();
  paddlePath(); ctx.clip();

  // groeven (zoals in het voorbeeld) + donkere sleuf bovenin
  ctx.lineCap = "round";
  for (const f of [0.38, 0.52, 0.66, 0.8]) {
    const rr = r1 + (r2 - r1) * f;
    ctx.beginPath(); ctx.arc(0, 0, rr, Math.PI / 2 - al * 0.62, Math.PI / 2 + al * 0.62);
    ctx.strokeStyle = "rgba(35,35,75,0.55)"; ctx.lineWidth = R * 0.008; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, rr + R * 0.008, Math.PI / 2 - al * 0.62, Math.PI / 2 + al * 0.62);
    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = R * 0.003; ctx.stroke();
  }
  const rs = r1 + (r2 - r1) * 0.11;
  ctx.beginPath(); ctx.arc(0, 0, rs, Math.PI / 2 - al * 0.58, Math.PI / 2 + al * 0.58);
  ctx.strokeStyle = "#2a2b4a"; ctx.lineWidth = R * 0.034; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, rs, Math.PI / 2 - al * 0.58, Math.PI / 2 + al * 0.58);
  ctx.strokeStyle = "#15162b"; ctx.lineWidth = R * 0.022; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, rs - R * 0.007, Math.PI / 2 - al * 0.55, Math.PI / 2 + al * 0.55);
  ctx.strokeStyle = "rgba(120,125,200,0.35)"; ctx.lineWidth = R * 0.003; ctx.stroke();
  ctx.lineCap = "butt";

  // waarschuwingsband (geel/zwart) langs de onderkant
  const NS = 9, ra = r2 - R * 0.075, rb2 = r2 + R * 0.01, stp = (2 * al) / NS;
  ctx.fillStyle = "#1b1b2d";
  ctx.beginPath(); ctx.arc(0, 0, rb2, Math.PI / 2 - al, Math.PI / 2 + al); ctx.arc(0, 0, ra, Math.PI / 2 + al, Math.PI / 2 - al, true); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#f0c43c";
  for (let k = 0; k < NS; k += 2) {
    const a0 = -al + k * stp, shf = stp * 0.6;
    const p0 = pt(ra, a0), p1 = pt(rb2, a0 + shf), p2 = pt(rb2, a0 + shf + stp), p3 = pt(ra, a0 + stp);
    ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.lineTo(p3[0], p3[1]); ctx.closePath(); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0, 0, ra, Math.PI / 2 - al, Math.PI / 2 + al);
  ctx.strokeStyle = "rgba(20,20,40,0.7)"; ctx.lineWidth = R * 0.006; ctx.stroke();

  // bouten langs de zijkanten
  for (const side of [-1, 1]) {
    for (let f = 0.2; f < 0.72; f += 0.13) {
      const p = pt(r1 + (r2 - r1) * f, side * al * 0.84);
      bolt(ctx, p[0], p[1], R * 0.0085);
    }
  }

  // lampje: rood vlak voordat de paddle tegen een blok drukt, anders groen
  const near = Math.abs(theta) > thetaMax * 0.86;
  const lp = pt(r1 + (r2 - r1) * 0.235, 0);
  ctx.shadowColor = near ? "#ff4a5e" : "#4aff9a"; ctx.shadowBlur = R * 0.035;
  ctx.fillStyle = near ? "#ff4a5e" : "#4aff9a";
  ctx.beginPath(); ctx.arc(lp[0], lp[1], R * 0.013, 0, TAU); ctx.fill();
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0;
  ctx.restore();

  // rand (lichte rand + donkere binnenrand)
  paddlePath();
  ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = R * 0.004; ctx.stroke();
  ctx.restore();

  // --- scharnier bovenaan ---
  ctx.save();
  ctx.translate(Q.x, Q.y);
  const hg = ctx.createRadialGradient(-hubR * 0.3, -hubR * 0.3, hubR * 0.1, 0, 0, hubR * 1.1);
  hg.addColorStop(0, "#d4d6f0"); hg.addColorStop(1, "#4e5080");
  ctx.fillStyle = hg; ctx.strokeStyle = "#2c2c4a"; ctx.lineWidth = R * 0.006;
  ctx.beginPath(); ctx.arc(0, 0, hubR, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = R * 0.003;
  ctx.beginPath(); ctx.arc(0, 0, hubR * 0.88, 0, TAU); ctx.stroke();
  ctx.rotate(-theta * 2);
  for (let k = 0; k < 6; k++) {
    const a = (k * TAU) / 6;
    bolt(ctx, Math.cos(a) * hubR * 0.66, Math.sin(a) * hubR * 0.66, R * 0.0085);
  }
  const cg2 = ctx.createRadialGradient(-hubR * 0.1, -hubR * 0.1, 0, 0, 0, hubR * 0.4);
  cg2.addColorStop(0, "#f0f1ff"); cg2.addColorStop(1, "#7a7ca8");
  ctx.fillStyle = cg2;
  ctx.beginPath(); ctx.arc(0, 0, hubR * 0.38, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#2c2c4a"; ctx.lineWidth = R * 0.004; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-hubR * 0.3, 0); ctx.lineTo(hubR * 0.3, 0); ctx.moveTo(0, -hubR * 0.3); ctx.lineTo(0, hubR * 0.3); ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(baseLayer.c, 0, 0, W, H);

  if (state === "play") ctx.drawImage(ringLayer.c, 0, 0, W, H);
  else for (const p of pieces) drawPiece(ctx, p.x, p.y, p.rot);

  drawBalls();
  drawCrusher();

  // plet-effecten: ring + vonkjes
  for (const f of fx) {
    ctx.strokeStyle = `rgba(255,255,255,${1 - f.age / 0.35})`;
    ctx.lineWidth = Math.max(1, rb * 0.5);
    ctx.beginPath();
    ctx.arc(f.x, f.y, rb * (1 + (f.age / 0.35) * 5), 0, TAU);
    ctx.stroke();
  }
  for (const sp of sparks) {
    ctx.globalAlpha = Math.max(0, sp.life / 0.45);
    ctx.fillStyle = colorMode === "custom" ? customColor : `hsl(${Math.round(sp.h)},85%,70%)`;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, Math.max(1, rb * 0.4), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // teller
  ctx.textAlign = "center";
  ctx.fillStyle = "#8a8aa8";
  ctx.font = `${R * 0.05}px Arial, sans-serif`;
  ctx.fillText(`${balls.length} balls`, cx, cy + R + R * 0.1);
}

// ====== OPTIES: kleur, snelheid, opname ======
const $ = id => document.getElementById(id);

$("gear").addEventListener("click", () => $("panel").classList.toggle("open"));

$("colorMode").addEventListener("change", e => {
  colorMode = e.target.value;
  $("colorRow").style.display = colorMode === "custom" ? "flex" : "none";
});
$("colorPick").addEventListener("input", e => {
  customColor = e.target.value;
  customHSL = hexToHsl(customColor);
  customSprite = null;
});

$("speed").addEventListener("input", e => {
  simSpeed = parseFloat(e.target.value);
  $("speedVal").textContent = simSpeed.toFixed(2).replace(/0$/, "") + "×";
});

$("ballVolume").addEventListener("input", e => {
  ballHitVolume = Number(e.target.value) / 100;
  $("ballVolumeVal").textContent = e.target.value + "%";
});

$("restartBtn").addEventListener("click", () => reset());

// Geluid moet eerst via een gebruikersklik worden geactiveerd.
$("soundBtn").addEventListener("click", enableSound);
$("soundStartBtn").addEventListener("click", enableSound);

// --- opnemen ---
let recorder = null, recChunks = [], recTimer = null, recStart = 0, recMime = "";

function pickMime() {
  const opts = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  return opts.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}

async function startRecording() {
  if (!window.MediaRecorder || !canvas.captureStream) {
    alert("Your browser does not support recording this animation. Try Chrome, Edge, or Safari.");
    return;
  }
  if (!initAudio()) {
    alert("Your browser does not support Web Audio. Sound cannot be recorded.");
    return;
  }
  try { await audioCtx.resume(); } catch (err) {}
  if ($("recRestart").checked) reset();
  recMime = pickMime();

  // hogere kwaliteit: alles opnieuw tekenen in de gekozen resolutie
  const target = parseInt($("recQuality").value, 10) || 0;
  if (target) {
    try { setRenderScale(target / Math.min(W, H)); }
    catch (err) { setRenderScale(displayDpr); alert("This quality is too demanding for your device. Choose a lower one."); return; }
  }
  const pixels = canvas.width * canvas.height;
  const bitrate = Math.round(Math.min(60e6, Math.max(8e6, pixels * 60 * 0.08)));

  let stream;
  try {
    stream = canvas.captureStream(60);
    const audioTrack = audioRecordDestination.stream.getAudioTracks()[0];
    if (audioTrack) stream.addTrack(audioTrack);
    recChunks = [];
    const options = recMime
      ? { mimeType: recMime, videoBitsPerSecond: bitrate, audioBitsPerSecond: 128000 }
      : { videoBitsPerSecond: bitrate, audioBitsPerSecond: 128000 };
    recorder = new MediaRecorder(stream, options);
  } catch (err) {
    restoreScale();
    alert("Recording could not start. Try a lower quality.");
    return;
  }
  recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = saveRecording;
  recorder.start(250);
  recStart = performance.now();
  $("recBtn").classList.add("on");
  updateRecLabel();
  recTimer = setInterval(updateRecLabel, 500);
}

function updateRecLabel() {
  const sec = Math.floor((performance.now() - recStart) / 1000);
  const m = Math.floor(sec / 60), r = String(sec % 60).padStart(2, "0");
  $("recBtn").textContent = `■ Stop recording (${m}:${r})`;
}

function stopRecording() {
  if (recorder && recorder.state !== "inactive") recorder.stop();
  clearInterval(recTimer);
  $("recBtn").classList.remove("on");
  $("recBtn").textContent = "● Start recording";
}

function restoreScale() {
  if (dpr !== displayDpr) setRenderScale(displayDpr);
}

function updateRecInfo() {
  const target = parseInt($("recQuality").value, 10) || 0;
  const sc = target ? target / Math.min(W, H) : displayDpr;
  $("recInfo").textContent = `Video will be ${Math.round(W * sc)} × ${Math.round(H * sc)} px` +
    (target >= 1440 ? " (may be demanding for your device)" : "");
}
$("recQuality").addEventListener("change", updateRecInfo);

function saveRecording() {
  const type = (recorder && recorder.mimeType) || recMime || "video/webm";
  const blob = new Blob(recChunks, { type });
  const ext = type.includes("mp4") ? "mp4" : "webm";
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `will-it-overflow.${ext}`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  recorder = null;
  restoreScale();
}

function isRecording() { return recorder && recorder.state === "recording"; }

// wordt aangeroepen als de overflow-animatie klaar is
function finishRun() {
  if (isRecording() && $("recAuto").checked) stopRecording();
}

$("recBtn").addEventListener("click", () => (isRecording() ? stopRecording() : startRecording()));

// ====== hoofdlus ======
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(0.05, (now - last) / 1000) * simSpeed;
  last = now;
  const DT = 1 / 120;
  let guard = 0;
  // Wacht met simuleren tot de bezoeker het geluid heeft ingeschakeld.
  if (soundEnabled) {
    while (acc >= DT && guard++ < 40) { step(DT); acc -= DT; }
  } else {
    acc = 0;
  }
  if (acc > DT * 40) acc = 0;
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener("resize", () => { if (!isRecording()) { resize(); updateRecInfo(); } });
resize();
updateRecInfo();
requestAnimationFrame(loop);

</script>
</body>
